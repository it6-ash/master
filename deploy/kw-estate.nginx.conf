# KW Estate — nginx vhost for srv1340120 (MODE=public).
#
# READ THIS FIRST. This page lists every server's IP and open ports, which
# units are failing, which hostnames have no certificate, where credentials sit
# in crontabs, and the text of every open security finding. It is a map of how
# to attack this estate. It must not be readable without authentication.
#
# HTTP basic auth over TLS is the floor, and it is what this file does.
#
# This block is HTTP-only on purpose. A `listen 443 ssl` block with no
# ssl_certificate fails `nginx -t` outright, so a vhost cannot ship its own TLS
# before a certificate exists. certbot --nginx adds the 443 server and turns
# this one into a redirect:
#
#   sudo apt install apache2-utils                       # for htpasswd
#   sudo htpasswd -c /etc/nginx/.kw-estate-htpasswd ash  # repeat without -c to add users
#   sudo cp kw-estate.nginx.conf /etc/nginx/sites-available/kw-estate
#   sudo ln -s /etc/nginx/sites-available/kw-estate /etc/nginx/sites-enabled/kw-estate
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d estate.leadq.co.in
#
# Point estate.leadq.co.in at this box as a DNS-only (grey cloud) A record.
# Proxied through Cloudflare, the browser gets Cloudflare's certificate and
# Let's Encrypt cannot see the origin it is trying to validate.
#
# Note the symlink. Two entries in this estate's sites-enabled are plain files
# rather than symlinks, and the dashboard raises a medium issue for each. Do
# not add a third.
#
# This vhost adds one server_name to an nginx that already terminates several.
# It claims no new port, touches no existing server block, and proxies nothing,
# so the other tenants here are unaffected. Confirm that yourself with
#   nginx -T | grep -n server_name
# before reloading.

# IPv4 ONLY, deliberately. Every other vhost on this box listens on IPv4 alone,
# so adding `listen [::]:80` here made this the first — and only — IPv6 listener,
# which makes it nginx's default server for IPv6. Every IPv6 client asking for
# any other hostname then got THIS server block and THIS certificate:
#
#   SNI n8n.srv1340120.hstgr.cloud over IPv4 -> n8n.srv1340120.hstgr.cloud
#   SNI n8n.srv1340120.hstgr.cloud over IPv6 -> estate.leadq.co.in
#
# Chrome, Node and Let's Encrypt all prefer IPv6, so n8n appeared to have a
# broken certificate, its ACME renewal 404'd, and the nightly report — which
# posts to n8n over HTTPS — stopped sending. One added line, five tenants
# affected. Do not re-add these until every vhost here listens on IPv6 too.
server {
    listen 80;
    server_name estate.leadq.co.in;

    # Served straight out of the checkout the timer rebuilds. No copy step, so
    # there is no window where the page and the data disagree.
    root /opt/kw-estate/dist;
    index index.html;

    # Before auth_basic, and ^~ so it wins outright: Let's Encrypt cannot type
    # a password, and a 401 here is an unissued certificate every 90 days.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    auth_basic           "KW Estate";
    auth_basic_user_file /etc/nginx/.kw-estate-htpasswd;

    # The whole dashboard is one file. Never let a stale copy be served: the
    # entire point is that the numbers were true at the last collection.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # It loads nothing from anywhere. Say so, so nothing can be injected into it.
    add_header Content-Security-Policy
        "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "no-referrer" always;
    # Carried onto the 443 block by certbot. Ignored over plain HTTP by design.
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/kw-estate.access.log;
    error_log  /var/log/nginx/kw-estate.error.log;
}
