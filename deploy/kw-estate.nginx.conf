# KW Estate — nginx vhost for srv1340120 (MODE=public).
#
# READ THIS FIRST. This page lists every server's IP and open ports, which
# units are failing, which hostnames have no certificate, where credentials sit
# in crontabs, and the text of every open security finding. It is a map of how
# to attack this estate. It must not be readable without authentication.
#
# HTTP basic auth over TLS is the floor, and it is what this file did on its
# own. It is now the BACKSTOP rather than the gate: kw-estate-admin.service
# serves the same dist/ behind Google sign-in with a named email allowlist, and
# this vhost proxies to it. Two consequences worth knowing:
#
#   - a shared htpasswd password tells you nothing about WHO read the page.
#     The admin panel writes config and starts processes, so that mattered.
#   - the basic-auth lines below are commented out, NOT deleted. If the admin
#     service is ever stopped, uncomment them and swap the proxy_pass block for
#     the `root` directive to go back to a static, password-protected page. The
#     file is the rollback.
#
# AUTH=basic in deploy/install.sh still writes the htpasswd variant; the
# installer picks between them.
#
# This block is HTTP-only on purpose. A `listen 443 ssl` block with no
# ssl_certificate fails `nginx -t` outright, so a vhost cannot ship its own TLS
# before a certificate exists. certbot --nginx adds the 443 server and turns
# this one into a redirect:
#
#   sudo apt install apache2-utils                       # for htpasswd
#   sudo htpasswd -c /etc/nginx/.kw-estate-htpasswd ash  # repeat without -c to add users
#   sudo cp kw-estate.nginx.conf /etc/nginx/sites-available/kw-estate
#   sudo ln -s /etc/nginx/sites-available/kw-estate /etc/nginx/sites-enabled/kw-estate
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d estate.leadq.co.in
#
# Point estate.leadq.co.in at this box as a DNS-only (grey cloud) A record.
# Proxied through Cloudflare, the browser gets Cloudflare's certificate and
# Let's Encrypt cannot see the origin it is trying to validate.
#
# Note the symlink. Two entries in this estate's sites-enabled are plain files
# rather than symlinks, and the dashboard raises a medium issue for each. Do
# not add a third.
#
# This vhost adds one server_name to an nginx that already terminates several.
# It claims no new port, touches no existing server block, and proxies nothing,
# so the other tenants here are unaffected. Confirm that yourself with
#   nginx -T | grep -n server_name
# before reloading.

# IPv4 ONLY, deliberately. Every other vhost on this box listens on IPv4 alone,
# so adding `listen [::]:80` here made this the first — and only — IPv6 listener,
# which makes it nginx's default server for IPv6. Every IPv6 client asking for
# any other hostname then got THIS server block and THIS certificate:
#
#   SNI n8n.srv1340120.hstgr.cloud over IPv4 -> n8n.srv1340120.hstgr.cloud
#   SNI n8n.srv1340120.hstgr.cloud over IPv6 -> estate.leadq.co.in
#
# Chrome, Node and Let's Encrypt all prefer IPv6, so n8n appeared to have a
# broken certificate, its ACME renewal 404'd, and the nightly report — which
# posts to n8n over HTTPS — stopped sending. One added line, five tenants
# affected. Do not re-add these until every vhost here listens on IPv6 too.
server {
    listen 80;
    server_name estate.leadq.co.in;

    # The admin service holds the sign-in, the session and the writes. It binds
    # 127.0.0.1 only, so this proxy is the single route to it.
    #
    # ROLLBACK: comment the location / block below, uncomment these two lines
    # and the auth_basic pair, and the page is a static file behind a password
    # again with nothing else running.
    #   root /opt/kw-estate/dist;
    #   index index.html;

    # Before any auth, and ^~ so it wins outright: Let's Encrypt cannot sign in
    # with Google, and a redirect here is an unissued certificate every 90 days.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    #   auth_basic           "KW Estate";
    #   auth_basic_user_file /etc/nginx/.kw-estate-htpasswd;

    location / {
        proxy_pass http://127.0.0.1:4179;
        proxy_http_version 1.1;

        # The session cookie is Secure, and the admin service decides that from
        # ADMIN_BASE_URL. These two headers are what let it know the browser
        # arrived over https even though this hop is plain http — without them
        # it would issue a cookie the browser then refuses to send back, and
        # the symptom is an endless redirect to /login with nothing in any log
        # saying why.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A collection pass triggered from the panel runs in the background and
        # answers immediately, so this only has to cover a slow page render.
        proxy_read_timeout 60s;

        # The whole dashboard is one file. Never let a stale copy be served:
        # the entire point is that the numbers were true at the last collection.
        add_header Cache-Control "no-store" always;
    }

    # The page loads nothing from anywhere except the signed-in user's Google
    # avatar. Say so, so nothing else can be injected into it.
    #
    # 'unsafe-inline' is not laxity here: every byte of CSS and JS is inlined
    # into the file on purpose, so that it opens from file:// with no network,
    # and inline IS what that means. There is no external origin to allow.
    add_header Content-Security-Policy
        "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data: https://lh3.googleusercontent.com; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options  "nosniff" always;
    # same-origin, not no-referrer: the OAuth callback needs the browser to
    # keep the request on this site, and no-referrer breaks nothing here but
    # same-origin is the honest description of what this page links to.
    add_header Referrer-Policy         "same-origin" always;
    # Carried onto the 443 block by certbot. Ignored over plain HTTP by design.
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/kw-estate.access.log;
    error_log  /var/log/nginx/kw-estate.error.log;
}
