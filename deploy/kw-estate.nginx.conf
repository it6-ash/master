# KW Estate — nginx vhost.
#
# READ THIS FIRST. This page lists every server's IP and open ports, which
# units are failing, which hostnames have no certificate, where credentials sit
# in crontabs, and the text of every open security finding. It is a map of how
# to attack this estate. It must not be readable without authentication.
#
# Basic auth over TLS is the minimum, and it is what this file does. If you
# want something better, put it behind the Cloudflare tunnel that already
# serves kwatch.leadq.co.in and use Cloudflare Access instead.
#
# Install:
#   sudo apt install apache2-utils                      # for htpasswd
#   sudo htpasswd -c /etc/nginx/.kw-estate-htpasswd ash # repeat without -c to add users
#   sudo cp kw-estate.nginx.conf /etc/nginx/sites-available/kw-estate
#   sudo ln -s /etc/nginx/sites-available/kw-estate /etc/nginx/sites-enabled/kw-estate
#   sudo mkdir -p /var/www/kw-estate
#   sudo certbot --nginx -d estate.leadq.co.in
#   sudo nginx -t && sudo systemctl reload nginx
#
# Note the symlink. Two entries in this estate's sites-enabled are plain files
# rather than symlinks, and the dashboard raises a medium issue for each. Do
# not add a third.

server {
    listen 80;
    listen [::]:80;
    server_name estate.leadq.co.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name estate.leadq.co.in;

    # certbot --nginx fills these in and rewrites this block in place.
    # ssl_certificate     /etc/letsencrypt/live/estate.leadq.co.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/estate.leadq.co.in/privkey.pem;

    root /var/www/kw-estate;
    index index.html;

    auth_basic           "KW Estate";
    auth_basic_user_file /etc/nginx/.kw-estate-htpasswd;

    # The whole dashboard is one file. Never let a stale copy be served: the
    # entire point is that the numbers were true at the last collection.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # It loads nothing from anywhere. Say so, so nothing can be injected into it.
    add_header Content-Security-Policy
        "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/kw-estate.access.log;
    error_log  /var/log/nginx/kw-estate.error.log;
}
