# KW Estate — nginx vhost for the Cloudflare tunnel path (MODE=tunnel).
#
# This is the better of the two. It binds loopback only, so the dashboard
# claims no public port on srv1340120 and nothing about it is reachable from
# the internet except through the tunnel cloudflared already runs for
# kwatch.leadq.co.in. Authentication is Cloudflare Access, not basic auth, and
# TLS is Cloudflare's, so there is no certificate to renew here.
#
# Install (deploy/install.sh MODE=tunnel does the nginx half):
#
#   1. add the ingress rule to the tunnel config, ABOVE the catch-all:
#        - hostname: estate.leadq.co.in
#          service: http://127.0.0.1:8060
#   2. cloudflared tunnel route dns <tunnel-name> estate.leadq.co.in
#   3. systemctl restart cloudflared
#   4. Cloudflare dashboard → Zero Trust → Access → Applications → Add:
#        estate.leadq.co.in, policy: emails you allow. Without this the page is
#        PUBLIC, and it names every open port and unrotated credential you have.

server {
    # Loopback only. cloudflared is the sole client.
    listen 127.0.0.1:8060;
    server_name estate.leadq.co.in;

    root /opt/kw-estate/dist;
    index index.html;

    # No auth_basic here on purpose: Cloudflare Access is the gate, and two
    # prompts for one page trains people to click through both.

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header Content-Security-Policy
        "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;

    access_log /var/log/nginx/kw-estate.access.log;
    error_log  /var/log/nginx/kw-estate.error.log;
}
